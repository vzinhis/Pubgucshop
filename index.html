<!DOCTYPE html>
<html>
<head>
  <title>PUBG Магазин</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <h2>Обери товар</h2>
  <select id="item">
    <option value="UC 60">UC 60</option>
    <option value="UC 325">UC 325</option>
    <option value="Скін на M416">Скін на M416</option>
  </select>
  <br><br>
  <input type="text" id="nickname" placeholder="Введи PUBG нік" />
  <br><br>
  <button onclick="sendData()">Замовити</button>

  <script>
    function sendData() {
      const item = document.getElementById('item').value;
      const nickname = document.getElementById('nickname').value;
      Telegram.WebApp.sendData(JSON.stringify({item, nickname}));
      Telegram.WebApp.close();
    }
  </script>
</body>
</html>
